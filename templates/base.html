<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CyberGuard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f4ff;
      --bg2: #e8eeff;
      --surface: #ffffff;
      --surface2: #f5f7ff;
      --border: #dde3f5;
      --border2: #c8d3f0;
      --accent: #4f6ef7;
      --accent2: #7c3aed;
      --accent3: #ef4444;
      --accent4: #10b981;
      --accent5: #f59e0b;
      --text: #1a1f36;
      --text2: #5a6282;
      --text3: #94a3b8;
      --shadow: 0 4px 24px rgba(79,110,247,0.10);
      --shadow-lg: 0 12px 48px rgba(79,110,247,0.15);
      --grad: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 100%);
      --grad-soft: linear-gradient(135deg, #eef1ff 0%, #f3eeff 100%);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Subtle mesh background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(79,110,247,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(124,58,237,0.05) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(16,185,129,0.03) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 64px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 12px rgba(79,110,247,0.08);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-brand-icon {
      width: 36px; height: 36px;
      background: var(--grad);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(79,110,247,0.3);
    }

    .nav-brand-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .nav-brand-text span { color: var(--accent); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text2);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--accent);
      background: rgba(79,110,247,0.08);
    }

    /* Dropdown */
    .dropdown { position: relative; }

    .dropdown-btn {
      color: var(--text2);
      font-size: 0.875rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      transition: all 0.2s;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Outfit', sans-serif;
    }

    .dropdown-btn:hover, .dropdown-btn.active {
      color: var(--accent);
      background: rgba(79,110,247,0.08);
    }

    .dropdown-btn svg { transition: transform 0.2s; }
    .dropdown:hover .dropdown-btn svg { transform: rotate(180deg); }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 250px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.2s;
      box-shadow: 0 20px 48px rgba(79,110,247,0.15);
    }

    .dropdown:hover .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text2);
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .dropdown-menu a:hover {
      color: var(--text);
      background: var(--bg2);
    }

    .menu-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .dropdown-menu a:nth-child(1) .menu-icon { background: rgba(79,110,247,0.12); }
    .dropdown-menu a:nth-child(2) .menu-icon { background: rgba(124,58,237,0.12); }
    .dropdown-menu a:nth-child(3) .menu-icon { background: rgba(16,185,129,0.12); }

    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 5px 6px;
    }

    /* ── PAGE WRAPPER ── */
    main {
      position: relative;
      z-index: 1;
      padding-top: 64px;
      min-height: 100vh;
    }

    /* ── SHARED COMPONENTS ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      transition: all 0.3s;
    }

    .card:hover {
      border-color: var(--border2);
      box-shadow: var(--shadow-lg);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 100px;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .badge-blue { background: rgba(79,110,247,0.1); color: var(--accent); border: 1px solid rgba(79,110,247,0.2); }
    .badge-cyan { background: rgba(6,182,212,0.1); color: #0891b2; border: 1px solid rgba(6,182,212,0.2); }
    .badge-purple { background: rgba(124,58,237,0.1); color: var(--accent2); border: 1px solid rgba(124,58,237,0.2); }
    .badge-red { background: rgba(239,68,68,0.1); color: var(--accent3); border: 1px solid rgba(239,68,68,0.2); }
    .badge-green { background: rgba(16,185,129,0.1); color: var(--accent4); border: 1px solid rgba(16,185,129,0.2); }
    .badge-amber { background: rgba(245,158,11,0.1); color: var(--accent5); border: 1px solid rgba(245,158,11,0.2); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--grad);
      color: #fff;
      box-shadow: 0 4px 16px rgba(79,110,247,0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(79,110,247,0.45);
      color: #fff;
    }

    .btn-outline {
      background: var(--surface);
      color: var(--text2);
      border: 1.5px solid var(--border2);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(79,110,247,0.05);
    }

    .btn-ghost {
      background: rgba(79,110,247,0.08);
      color: var(--accent);
      border: none;
    }

    .btn-ghost:hover {
      background: rgba(79,110,247,0.15);
      transform: translateY(-1px);
    }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 600;
    }

    h1, h2, h3 {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
      color: var(--text);
    }

    .accent-line {
      height: 3px;
      background: var(--grad);
      border-radius: 2px;
      margin: 20px 0;
      width: 48px;
    }

    .progress-bar {
      height: 8px;
      background: var(--bg2);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 1s ease;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 0.875rem;
      z-index: 9999;
      opacity: 0;
      transform: translateY(16px);
      transition: all 0.3s;
      pointer-events: none;
      box-shadow: var(--shadow-lg);
    }

    #toast.show { opacity: 1; transform: translateY(0); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(79,110,247,0.2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(79,110,247,0.4); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseRing {
      0%, 100% { box-shadow: 0 0 0 0 rgba(79,110,247,0.3); }
      50% { box-shadow: 0 0 0 8px rgba(79,110,247,0); }
    }

    .animate-up { animation: fadeUp 0.5s ease forwards; }

    /* Loading spinner */
    .loading-spin {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(79,110,247,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav>
  <a href="/" class="nav-brand">
    <div class="nav-brand-icon">🛡️</div>
    <span class="nav-brand-text">Cyber<span>Guard</span></span>
  </a>

  <ul class="nav-links">
    <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a></li>
    <li><a href="/about" class="{% if request.path == '/about' %}active{% endif %}">About</a></li>
    <li><a href="/models" class="{% if request.path == '/models' %}active{% endif %}">Models</a></li>

    <li class="dropdown">
      <button class="dropdown-btn {% if '/predict' in request.path %}active{% endif %}">
        Predictions
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="dropdown-menu">
        <a href="/predict/url">
          <span class="menu-icon">🔗</span>
          <div>
            <div style="color:var(--text);font-weight:700">URL Phishing</div>
            <div style="font-size:0.72rem;color:var(--text3)">Random Forest · 99.97%</div>
          </div>
        </a>
        <div class="dropdown-divider"></div>
        <a href="/predict/cyber">
          <span class="menu-icon">⚡</span>
          <div>
            <div style="color:var(--text);font-weight:700">Cyber Attack</div>
            <div style="font-size:0.72rem;color:var(--text3)">LightGBM · 99.16%</div>
          </div>
        </a>
        <div class="dropdown-divider"></div>
        <a href="/predict/chatbot">
          <span class="menu-icon">🤖</span>
          <div>
            <div style="color:var(--text);font-weight:700">AI Assistant</div>
            <div style="font-size:0.72rem;color:var(--text3)">Llama 3.3 · Groq</div>
          </div>
        </a>
      </div>
    </li>
  </ul>
</nav>

<main>{% block content %}{% endblock %}</main>

<div id="toast"></div>

<script>
function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  const colors = { info: '#4f6ef7', success: '#10b981', error: '#ef4444', warning: '#f59e0b' };
  t.innerHTML = `<span style="color:${colors[type]||colors.info}">●</span> ${msg}`;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
