<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload CSV - Smart Sentry</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root {
      --primary: #00d4ff;
      --secondary: #00aaff;
      --accent: #00ff88;
      --dark: #0a1a2e;
      --light: #e0f7ff;
      --glow: 0 0 25px rgba(0, 212, 255, 0.7), 0 0 50px rgba(0, 212, 255, 0.4);
      --text-glow: 0 0 15px rgba(0, 212, 255, 0.6);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Rajdhani', sans-serif;
      color: var(--light);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--dark);
      overflow-x: hidden;
      font-weight: 600;
    }

    /* === NAVBAR === */
    .navbar {
      background: rgba(10, 26, 46, 0.97) !important;
      backdrop-filter: blur(15px);
      padding: 1.2rem 2rem;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
      border-bottom: 2px solid rgba(0, 212, 255, 0.4);
      z-index: 1000;
    }
    .navbar-brand { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2rem; color: var(--primary) !important; display: flex; align-items: center; gap: 14px; text-shadow: var(--glow); letter-spacing: 1px; }
    .navbar-nav { gap: 2rem; }
    .nav-link { color: #ffffff !important; font-weight: 700; font-size: 1.1rem; position: relative; transition: all 0.3s ease; padding: 0.6rem 0; text-transform: uppercase; letter-spacing: 0.5px; }
    .nav-link::after { content: ''; position: absolute; width: 0; height: 3px; bottom: -6px; left: 50%; background: var(--primary); transition: all 0.3s ease; transform: translateX(-50%); border-radius: 2px; }
    .nav-link:hover::after { width: 100%; }
    .nav-link:hover { color: var(--primary) !important; text-shadow: var(--text-glow); transform: translateY(-2px); }

    /* === HERO SECTION === */
    .hero-bg { 
      background: linear-gradient(rgba(10, 26, 46, 0.5), rgba(10, 26, 46, 0.68)), url('https://plus.unsplash.com/premium_photo-1677093905912-a653c6301260?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8dXBsb2FkfGVufDB8fDB8fHww') center/cover no-repeat fixed; 
      min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem; position: relative;
    }
    .hero h2 { font-family: 'Orbitron', sans-serif; font-size: 3rem; font-weight: 900; text-shadow: var(--glow); margin-bottom: 2rem; }

    /* === UPLOAD FORM === */
    .upload-form { background: rgba(5,15,30,0.85); padding: 2rem; border-radius: 20px; box-shadow: 0 0 20px rgba(0,212,255,0.3); width: 100%; max-width: 1000px; }
    .btn-cta { background: linear-gradient(45deg, var(--primary), var(--secondary)); border: none; padding: 18px 50px; font-weight: 700; font-size: 1.35rem; border-radius: 60px; color: white; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 6px 20px rgba(0, 212, 255, 0.3); transition: all 0.4s ease; }
    .btn-cta:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0, 212, 255, 0.5); background: linear-gradient(45deg, var(--secondary), var(--primary)); }

    /* Scrollable table */
    .table-container { max-height: 400px; overflow-y: auto; overflow-x: auto; margin-top: 1.5rem; border-radius: 10px; }
    table { width: 100%; background: rgba(255,255,255,0.05); color:#fff; border-radius: 10px; }
    th, td { text-align:center; padding: 0.5rem; white-space: nowrap; }

    /* === FOOTER === */
    footer { background: rgba(5, 15, 30, 0.98); border-top: 1px solid rgba(0, 212, 255, 0.3); padding: 2rem 0; text-align: center; font-size: 1rem; color: #88c9ff; backdrop-filter: blur(10px); }
    footer strong { color: var(--primary); }
    footer a { color: var(--accent); text-decoration: none; font-weight: 700; }
    footer a:hover { color: var(--primary); text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="/home">Smart Sentry</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="/uhome">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="/upload">Upload</a></li>
          <li class="nav-item"><a class="nav-link" href="/model">Model</a></li>
          <li class="nav-item"><a class="nav-link" href="/prediction">Prediction</a></li>
          <li class="nav-item"><a class="nav-link" href="/index2">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-bg">
    <div class="hero upload-form">
      <h2>Upload CSV File</h2>
      <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <input type="file" class="form-control" name="csvfile" accept=".csv" required>
        </div>
        <button type="submit" class="btn btn-cta w-100">Upload</button>
      </form>

      {% if table_html %}
      <h3 class="mt-4">CSV Contents (First 100 Rows)</h3>
      <div class="table-container">
        {{ table_html | safe }}
      </div>
      {% endif %}
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p class="mb-0">
        © 2025 <strong>Smart Sentry</strong>. All Rights Reserved. 
        | <a href="/">Privacy Policy</a> | <a href="/">Terms of Service</a>
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
