<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Sentry - URL Prediction</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root {
      --primary: #00d4ff;
      --accent: #00ff88;
      --dark: #0a1a2e;
      --light: #e0f7ff;
      --glow: 0 0 25px rgba(0, 212, 255, 0.7);
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--dark);
      color: var(--light);
    }

    /* ===== NAVBAR (MATCHED STYLE) ===== */
    .navbar {
      background: rgba(10, 26, 46, 0.97) !important;
      backdrop-filter: blur(15px);
      padding: 1.2rem 2.5rem;
      border-bottom: 2px solid rgba(0, 212, 255, 0.4);
    }

    .navbar-brand {
      font-family: 'Orbitron';
      font-size: 1.9rem;
      color: var(--primary) !important;
      display: flex;
      align-items: center;
      gap: 12px;
      text-shadow: var(--glow);
    }

    .logo-svg {
      width: 48px;
      height: 48px;
    }

    .navbar-nav {
      gap: 2rem;
      align-items: center;
    }

    .nav-link {
      color: white !important;
      font-weight: 700;
      font-size: 1.05rem;
      position: relative;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: 0.3s;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 3px;
      bottom: -6px;
      left: 50%;
      background: var(--primary);
      transition: 0.3s;
      transform: translateX(-50%);
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .nav-link:hover {
      color: var(--primary) !important;
    }

    /* ===== MAIN BOX ===== */
    .container-box {
      margin-top: 130px;
      background: rgba(5,15,30,0.9);
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,212,255,0.2);
      max-width: 700px;
    }

    h2 {
      color: var(--primary);
      font-weight: 700;
    }

    .btn-info {
      background: var(--primary);
      border: none;
      font-weight: 700;
    }

    .btn-info:hover {
      background: var(--accent);
      color: black;
    }

    footer {
      background: rgba(5, 15, 30, 0.98);
      padding: 1rem;
      text-align: center;
      color: #88c9ff;
      margin-top: 50px;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container-fluid">

    <a class="navbar-brand" href="/index2">
      <svg class="logo-svg" viewBox="0 0 100 100">
        <path d="M50 8 L22 32 L22 62 C22 78, 50 92, 50 92 C50 92, 78 78, 78 62 L78 32 Z"
              fill="none" stroke="#00d4ff" stroke-width="4"/>
        <circle cx="35" cy="42" r="4" fill="#00ff88"/>
        <circle cx="65" cy="42" r="4" fill="#00ff88"/>
        <circle cx="50" cy="65" r="4" fill="#00ff88"/>
      </svg>
      Smart Sentry
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/index2">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/model">Models</a></li>
        <li class="nav-item"><a class="nav-link active" href="/prediction">URL Prediction</a></li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">
            <i class="fas fa-user"></i> Login
          </a>
        </li>
      </ul>
    </div>

  </div>
</nav>

<!-- LOGIN MODAL -->
<div class="modal fade" id="loginModal">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-white">

      <div class="modal-header">
        <h5 class="modal-title">Login</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <form method="POST" action="/login">
        <div class="modal-body">
          <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required>
          </div>

          <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-info w-100">Login</button>
        </div>
      </form>

    </div>
  </div>
</div>

<!-- MAIN -->
<div class="container d-flex justify-content-center">
  <div class="container-box w-100">

    <h2 class="text-center mb-4">URL Threat Prediction</h2>

    {% if prediction %}
    <div class="alert alert-primary">
      <strong>Prediction:</strong> {{ prediction }}
    </div>
    {% endif %}

    {% if suggestion %}
    <div class="alert alert-info">
      <strong>Suggestion:</strong> {{ suggestion }}
    </div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label>Enter URL</label>
        <input type="text" name="url" class="form-control" placeholder="https://example.com" required>
      </div>

      <button class="btn btn-info w-100">Predict</button>
    </form>

  </div>
</div>

<!-- FOOTER -->
<footer>
  © 2025 <strong>Smart Sentry</strong>. All Rights Reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
