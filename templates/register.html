<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Sentry - Register</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root {
      --primary: #00d4ff;
      --secondary: #00aaff;
      --accent: #00ff88;
      --dark: #0a1a2e;
      --light: #e0f7ff;
      --glow: 0 0 25px rgba(0, 212, 255, 0.7), 0 0 50px rgba(0, 212, 255, 0.4);
      --text-glow: 0 0 15px rgba(0, 212, 255, 0.6);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Rajdhani', sans-serif;
      color: var(--light);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--dark);
      overflow-x: hidden;
      font-weight: 600;
    }

    /* === BACKGROUND === */
    .hero-bg {
      background: 
        linear-gradient(rgba(10, 26, 46, 0.5), rgba(10, 26, 46, 0.68)),
        url('https://images.unsplash.com/photo-1719861566531-b1c880d89ed6?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fHJlZ2lzdGVyJTIwbGFwdG9wfGVufDB8fDB8fHww') 
        center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    /* === NAVBAR === */
    .navbar {
      background: rgba(10, 26, 46, 0.97) !important;
      backdrop-filter: blur(15px);
      padding: 1.2rem 2rem;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
      border-bottom: 2px solid rgba(0, 212, 255, 0.4);
      z-index: 1000;
    }

    .navbar-brand {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 2rem;
      color: var(--primary) !important;
      display: flex;
      align-items: center;
      gap: 14px;
      text-shadow: var(--glow);
      letter-spacing: 1px;
    }

    .logo-svg {
      width: 50px;
      height: 50px;
      filter: drop-shadow(0 0 12px rgba(0,212,255,0.8));
      animation: pulseGlow 2.5s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .navbar-nav { gap: 2rem; }
    .nav-link {
      color: #ffffff !important;
      font-weight: 700;
      font-size: 1.1rem;
      position: relative;
      transition: all 0.3s ease;
      padding: 0.6rem 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 3px;
      bottom: -6px;
      left: 50%;
      background: var(--primary);
      transition: all 0.3s ease;
      transform: translateX(-50%);
      border-radius: 2px;
    }

    .nav-link:hover::after { width: 100%; }
    .nav-link:hover {
      color: var(--primary) !important;
      text-shadow: var(--text-glow);
      transform: translateY(-2px);
    }

    /* === REGISTER CARD === */
    .register-box {
      width: 420px;
      background: rgba(255,255,255,0.08);
      padding: 35px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.15);
      backdrop-filter: blur(12px);
      animation: fadeInUp 1s ease forwards;
    }

    .register-box h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 25px;
      color: var(--primary);
      text-shadow: var(--text-glow);
    }

    .form-control {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 1.1rem;
    }

    .form-control:focus {
      background: rgba(255,255,255,0.1);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 0 8px var(--primary);
    }

    .btn-register {
      width: 100%;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border: none;
      padding: 12px;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 8px;
      color: #000;
      transition: 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-register:hover {
      background: linear-gradient(45deg, var(--secondary), var(--primary));
      box-shadow: var(--glow);
      transform: translateY(-3px);
    }

    .alert {
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === FOOTER === */
    footer {
      background: rgba(5, 15, 30, 0.98);
      border-top: 1px solid rgba(0, 212, 255, 0.3);
      padding: 2rem 0;
      text-align: center;
      font-size: 1rem;
      color: #88c9ff;
      backdrop-filter: blur(10px);
    }

    footer strong { color: var(--primary); }
    footer a { color: var(--accent); text-decoration: none; font-weight: 700; }
    footer a:hover { color: var(--primary); text-decoration: underline; }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="/index2">
        <svg class="logo-svg" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00d4ff"/>
              <stop offset="50%" stop-color="#00ff88"/>
              <stop offset="100%" stop-color="#00aaff"/>
            </linearGradient>
          </defs>
          <path d="M50 8 L22 32 L22 62 C22 78, 50 92, 50 92 C50 92, 78 78, 78 62 L78 32 Z" 
                fill="none" stroke="url(#grad)" stroke-width="5"/>
          <circle cx="35" cy="42" r="5" fill="url(#grad)"/>
          <circle cx="65" cy="42" r="5" fill="url(#grad)"/>
          <circle cx="50" cy="65" r="5" fill="url(#grad)"/>
          <line x1="35" y1="42" x2="50" y2="65" stroke="url(#grad)" stroke-width="3"/>
          <line x1="50" y1="65" x2="65" y2="42" stroke="url(#grad)" stroke-width="3"/>
          <line x1="35" y1="42" x2="65" y2="42" stroke="url(#grad)" stroke-width="3"/>
          <text x="50%" y="48%" text-anchor="middle" fill="#ffffff" font-size="28" font-family="Orbitron" font-weight="900">S</text>
        </svg>
        Smart Sentry
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="/index2">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="/register">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <br><br><br><br>

  <!-- REGISTER SECTION -->
  <section class="hero-bg">
    <div class="register-box">

      <h2>Create Account</h2>

      <!-- FLASH MESSAGES -->
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-warning">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="/register" method="POST">

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" name="username" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>

        <div class="mb-4">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" name="cpassword" required>
        </div>

        <button type="submit" class="btn-register">Register</button>

      </form>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <p class="mb-0">
        © 2025 <strong>Smart Sentry</strong>. All Rights Reserved. 
        | <a href="/">Privacy Policy</a> 
        | <a href="/">Terms of Service</a>
      </p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
